services:
  patient-service-db:
    image: postgres:15
    container_name: patient-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5001:5432"
    volumes:  # Persists PostgreSQL data across container restarts and recreation
      - postgres_data:/var/lib/postgresql/data
    networks:
      - patient-network
    healthcheck: # Checks whether PostgreSQL is ready to accept connections before dependent services start
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"] # In CMD-SHELL, check PostgreSQL availability using user admin_user and database db
      interval: 30s
      timeout: 10s      # Allow each check up to 10 seconds
      retries: 5        # Mark unhealthy after 5 failed checks
      start_period: 10s # Allow 10 seconds for PostgreSQL to start

  patient-service:
    build:  # Build Docker image from Dockerfile
      context: .  # Use project root as Docker build context
      dockerfile: patient-service/Dockerfile
    container_name: patient-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: password

      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      patient-service-db:
        condition: service_healthy
      billing-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - patient-network
    restart: unless-stopped

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: billing-service
    ports:
      - "4001:4001"   # REST  ## Host port 4001 -> Billing Service container port 4001
      - "9001:9001"   # gRPC
    networks:
      - patient-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093

      # Single-broker setup requires a replication factor of 1 for consumer offsets.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Single-broker setup requires a replication factor of 1 for transaction state.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Allow transactions with a single in-sync replica in local development.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

    volumes:
      - kafka_data:/tmp/kraft-combined-logs

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - patient-network

    restart: unless-stopped

  # Kafka UI for inspecting and managing the local Kafka broker during development.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Connection via kafka:9092 for Docker services; external clients would use localhost:9094(127.0.0.1:9094).
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - patient-network
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    ports:
      - "4002:4002"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - patient-network
    restart: unless-stopped

  api-gateway:
      build:
        context: .
        dockerfile: api-gateway/Dockerfile
      container_name: api-gateway
      ports:
        - "4004:4004"
      environment:
        AUTH_SERVICE_URL: http://auth-service:4005
      networks:
        - patient-network
      restart: unless-stopped

  auth-service-db:
    image: postgres:15
    container_name: auth-service-db
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: password
    ports:
      - "5002:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - patient-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - patient-network
    restart: unless-stopped

volumes:
  postgres_data:
  auth_postgres_data:
  kafka_data:

networks:
  patient-network:
    driver: bridge