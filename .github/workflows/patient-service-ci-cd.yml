name: Patient Service CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Shared proto module must be installed first because the services depend on it.
      - name: Build proto module
        # Build app automatically without user input, skip tests
        run: mvn -B clean install -f proto/pom.xml -DskipTests

      - name: Run tests with H2 profile
        run: mvn -B clean test -f patient-service/pom.xml -Dspring.profiles.active=test

      - name: Build patient-service with Maven
        run: mvn -B clean package -f patient-service/pom.xml -DskipTests

      - name: Build billing-service with Maven
        run: mvn -B clean package -f billing-service/pom.xml -DskipTests

      - name: Build analytics-service with Maven
        run: mvn -B clean package -f analytics-service/pom.xml -DskipTests

      - name: Build api-gateway with Maven
        run: mvn -B clean package -f api-gateway/pom.xml -DskipTests

      - name: Build auth-service with Maven
        run: mvn -B clean package -f auth-service/pom.xml -DskipTests

      - name: Validate AWS CDK infrastructure
        working-directory: infrastructure
        run: |
          mvn compile
          mvn exec:java -Dexec.mainClass="com.anishshinde.stack.LocalStack"
          test -f cdk.out/localstack.template.json

      - name: Build Docker images
        run: docker compose build

      - name: Prepare Kafka volume
        # Fix CI build: Set Kafka volume ownership as fresh Actions volume not writable by Kafka's appuser.
        # CI error: java.nio.file.AccessDeniedException: /tmp/kraft-combined-logs/bootstrap.checkpoint.tmp
        run: |
          docker volume create patient-management-system_kafka_data
          docker run --rm \
            -v patient-management-system_kafka_data:/data \
            busybox chown -R 1000:1000 /data

      - name: Start services for integration tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: docker compose up -d --wait

      - name: Run integration tests
        run: mvn -B test -f integration-tests/pom.xml

      - name: Stop integration test containers
        if: always()
        run: docker compose down

      - name: Login to GitHub Container Registry
        # Only login when the workflow is running on the main branch
        if: github.ref == 'refs/heads/main'
        # Use GitHub's existing Docker login action instead of writing the login ourselves
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # ${{ }} accesses values provided by GitHub Actions
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upload patient-service Docker image to ghcr
      - name: Push patient-service
        if: github.ref == 'refs/heads/main'
        # Give local image the full location required by ghcr and push tagged image to it
        run: |
          docker tag patient-service ghcr.io/${{ github.repository }}/patient-service:latest
          docker push ghcr.io/${{ github.repository }}/patient-service:latest

      - name: Push billing-service
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag billing-service ghcr.io/${{ github.repository }}/billing-service:latest
          docker push ghcr.io/${{ github.repository }}/billing-service:latest

      - name: Push analytics-service
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag analytics-service ghcr.io/${{ github.repository }}/analytics-service:latest
          docker push ghcr.io/${{ github.repository }}/analytics-service:latest

      - name: Push api-gateway
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag api-gateway ghcr.io/${{ github.repository }}/api-gateway:latest
          docker push ghcr.io/${{ github.repository }}/api-gateway:latest

      - name: Push auth-service
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag auth-service ghcr.io/${{ github.repository }}/auth-service:latest
          docker push ghcr.io/${{ github.repository }}/auth-service:latest